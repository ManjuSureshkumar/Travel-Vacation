<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Open Sans", sans-serif;
}

body {
  background:white;
}
/* LAYOUT */
.categories-container {
  display: flex;
  gap: 50px;
  align-items: flex-start;
  padding: 20px;
}

/* SIDEBAR */
.sidebar {
  width: 330px;
  background: #f31b03;
  color: white;
  padding: 20px;
  border-radius: 12px;

  display: flex;
  flex-direction: column;
  gap: 25px;
}

/* TITLES */
.sidebar h2 {  font-size: 26px;  font-weight: 700; }
.sidebar h3 {  font-size: 20px;  font-weight: 600; margin-bottom: 5px;}

/* SECTION */
.section {   display: flex;   flex-direction: column;}

/* PRICE */
.price-values {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

/* TWO COLUMN */
.two-col { display: flex;   justify-content: space-between; gap:12px}
.two-col div {   width: 149px;}

.two-col label {
  display: block;
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 4px;
  
}

.two-col input {
  width: 149px;
  height: 29px;
  border-radius: 55px;
  border: none;
  outline: none;
  padding: 0 10px;
  font-size: 13px;
  background: white;
}

/* INPUTS */
input[type="text"],
input[type="date"] {
  width : 145px;
  height: 29px;
  padding: 8px;
  border-radius: 10px;
  border: 2px solid black;
  background: white;
}

/* RANGE */
input[type="range"] {
  width: 100%;
  color: black;
}

/* LABELS */
label {
  display: flex;
  align-items: center;
}

/* CHECKBOX / RADIO */
input[type="checkbox"],
input[type="radio"] {
  accent-color: white;
  width: 16px;
  height: 16px;
  font-size: 20px;
  font-weight: 400;
}

/* BUTTON */
.submit-btn {
  margin-top: 10px;
  padding: 10px;
  background: #eee;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* CARDS 
.card-row {
  display: flex;
  gap: 20px;
}

.card {
  min-width: 215px;
  background: #f31b03;
  color: white;
  border-radius: 15px;
  padding: 10px;
}

.card img {
  width: 100%;
  height: 130px;
  border-radius: 10px;
}

.card button {
  width: 100%;
  padding: 6px;
  background: white;
  border: none;
  border-radius: 6px;
  margin-top: 5px;
}

/* RIGHT SIDE */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* CARD 
.card {
  background: #F31B03;
  border-radius: 18px;
  box-shadow: 8px 6px 4px rgba(0,0,0,0.25);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.card img {
width: 100%;
  height: 120px;
  object-fit: cover;
}
.card-content {
  padding: 12px;
  color: white;
  flex: 1;
}

.card-content h3 {
  font-size: 20px;
  margin-bottom: 8px;
}

.card-content p {
  font-size: 14px;
}

/* BUTTONS 
.card-actions {
  display: flex;
  justify-content: space-between;
  padding: 12px;
}

.read-btn {
  background: white;
  color: black;
  padding: 6px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
}
.card span {
  color: #F3FFC5;
  font-size: 14px;
}

/* TARGET ONLY THESE FILTER SECTIONS */
.trip-section h3,
.accommodation-section h3,
.city-section h3,
.offer-section h3,
.suitable-section h3,
.rating-section h3 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 4px;;
}

/* LABEL TEXT STYLE */
.trip-section label,
.accommodation-section label,
.city-section label,
.offer-section label,
.suitable-section label,
.rating-section label {
  font-size: 20px;
  font-weight: 400;
  margin: 0;
  line-height: 1.2;
}

/* CHECKBOX / RADIO SIZE */
.trip-section input,
.accommodation-section input,
.city-section input,
.offer-section input,
.suitable-section input,
.rating-section input {
  width: 18px;
  height: 18px;
  gap:4px;
}

  display: flex;
  align-items: flex-start;

}*/

/* GRID (REPLACES ABSOLUTE CHAOS 😄) */
.card-grid {
  flex:1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 120px;
}

/* CARD */
.figma-card {
  position: relative;
  width: 100%;
  max-width: 220px;
  height: 300px;
  background: #F31B03;
  border-radius: 18px;
  box-shadow: 8px 6px 4px rgba(0,0,0,0.25);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* IMAGE */
.card-img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

/* TITLE */
.card-title {
  margin: 10px;
  color: white;
  font-size: 24px;
  font-weight: 600;
}

/* DAYS */
.card-days {
  font-size: 15px;
  font-weight: 600;
  color: white;
  margin: 0 10px;
}

/* PRICE */
.card-price {
  font-size: 15px;
  font-weight: 600;
  color: #F3FFC5;
  margin: 5px;
}

/* BUTTON */
.card-btn {
  padding: 6px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  margin:10px;
}

/* HEART */
.wishlist {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #F31B03;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wishlist i {
  color: white;
}
</style>

  <!-- SIDEBAR -->

    <h2>Filter Section</h2>

    <div class="section">

    <!-- DURATION -->
    <div class="section">

        <div>

      <label>Duration</label>

    </div>

    <!-- TRIP TYPE -->
    <div class="section trip-section">
      <h3 >Trip Type</h3>
      <label><input type="checkbox"> Beach holiday</label>
      <label><input type="checkbox"> Adventure holiday</label>
      <label><input type="checkbox"> Honeymoon holiday</label>
      <label><input type="checkbox"> Family Vacation Trip</label>
      <label><input type="checkbox"> Cultural Trip holiday</label>
      <label><input type="checkbox"> Budget Travel</label>
    </div>

    <!-- ACCOMMODATION -->
    <div class="section accommodation-section">
      <h3>Accommodation Type</h3>
      <label><input type="radio" name="acc"> Hotel</label>
      <label><input type="radio" name="acc"> Resort</label>
      <label><input type="radio" name="acc"> Villa</label>
      <label><input type="radio" name="acc"> Hostel</label>
      <label><input type="radio" name="acc"> Cruise</label>
    </div>

    <!-- CITY -->
    <div class="section city-section">
      <h3>Departure City</h3>
      <label><input type="radio" name="city"> Mumbai</label>
      <label><input type="radio" name="city"> Delhi</label>
      <label><input type="radio" name="city"> Bangalore</label>
      <label><input type="radio" name="city"> Chennai</label>
      <label><input type="radio" name="city"> Kolkata</label>
    </div>

    <!-- OFFER -->
    <div class="section offer-section">
      <h3>Special offer</h3>
      <label><input type="radio" name="offer"> Discount</label>
      <label><input type="radio" name="offer"> Last minute-deals</label>
      <label><input type="radio" name="offer"> All-inclusive</label>
    </div>

    <!-- SUITABLE -->
    <div class="section suitable-section">
      <h3>Suitable for</h3>
      <label><input type="radio" name="type"> Solo</label>
      <label><input type="radio" name="type"> Couple</label>
      <label><input type="radio" name="type"> Family</label>
    </div>

    <!-- RATING -->
    <div class="section rating-section">
      <h3>Ratings</h3>
      <label><input type="radio" name="rating"> 5 star</label>
      <label><input type="radio" name="rating"> 4 star & Above</label>
    </div>

    <button class="submit-btn">Submit</button>

  </aside>

<script>
function bookNow(title, days, price) {

  const data = {
    title: title,
    days: days,
    price: price,
    tax: 0,
    discount: 500
  };

  // store in localStorage
  localStorage.setItem("bookingData", JSON.stringify(data));

  // go to order page
  window.location.href = "samporder.html";  // your payment page
}
</script>
