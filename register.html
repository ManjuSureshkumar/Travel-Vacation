<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auth Page</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<!-- ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Open Sans', sans-serif;
}

body {
  background: #f9f3f3;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.main-container {
  width: 1200px;
  height: 560px;
  display: flex;
  border-radius: 24px;
  overflow: hidden;
}

/* LEFT */
.form-container {
  width: 65%;
  background: #fff;
  margin: 30px;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 7px 6px 10px rgba(0,0,0,0.2);
}

.form-container h2 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 25px;
}

/* INPUT */
.form-container input {
  width: 100%;
  height: 55px;
  margin-bottom: 20px;
  border: 1.5px solid #F31B03;
  border-radius: 14px;
  padding: 0 20px;
  background:white;
  outline: none;
  font-size: 16px;
  color: red;
   
}

/* ACTION */
.action-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.login-btn {
  background: #F31B03;
  color: white;
  border: none;
  padding: 12px 45px;
  border-radius: 14px;
  font-size: 18px;
  cursor: pointer;
}

.forgot {
  font-size: 14px;
  color: #555;
  text-decoration: none;
}

/* DIVIDER */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 25px 0;
  gap: 10px;
}

.divider span {
  width: 80px;
  height: 1px;
  background: #F31B03;
}

.social-box {
  border: 1.5px solid #F31B03;
  border-radius: 14px;
  padding: 12px;
  display: flex;
  justify-content: space-evenly;
}

.social-box i {
  font-size: 22px;
}

.fa-google { color: #EA4335; }
.fa-facebook-f { color: #1877F2; }
.fa-twitter { color: #1DA1F2; }

.fa-instagram {
  background: radial-gradient(circle,#FFDD55,#FF543E,#C837AB);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* BOTTOM */
.bottom-text {
  text-align: center;
  margin-top: 15px;
}

.bottom-text a {
  color: #F31B03;
  font-weight: 600;
  cursor: pointer;
}

/* IMAGE */
.image-container {
  width: 35%;
  background: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e") center/cover no-repeat;
}

/* HIDE */
.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="main-container">

  <!-- FORM -->
  <div class="form-container">

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <h2>Register Free !</h2>

      <input type="email" id="loginEmail" placeholder="Enter your e-mail">
      <input type="password" id="loginPassword" placeholder="Password">

      <div class="action-row">
        <button class="login-btn" onclick="login()">Login</button>
        <a class="forgot" onclick="forgotPassword()">Forget your password?</a>
      </div>

      <div class="divider">
        <span></span>
        <p>Sign Up Using</p>
        <span></span>
      </div>

      <div class="social-box">
        <i class="fab fa-google" onclick="socialLogin('google')"></i>
        <i class="fab fa-facebook-f" onclick="socialLogin('facebook')"></i>
        <i class="fab fa-instagram" onclick="socialLogin('instagram')"></i>
        <i class="fab fa-twitter" onclick="socialLogin('twitter')"></i>
      </div>

      <div class="bottom-text">
        Don’t have an account ?
        <a onclick="showSignup()">Create New Account</a>
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="hidden">
      <h2>Create Account</h2>

      <input type="email" id="signupEmail" placeholder="Enter your e-mail">
      <input type="password" id="signupPassword" placeholder="Create password">

      <button class="login-btn" onclick="signup()">Sign Up</button>

      <div class="bottom-text">
        Already have an account ?
        <a onclick="showLogin()">Login</a>
      </div>
    </div>

  </div>

  <!-- IMAGE -->
  <div class="image-container"></div>

</div>

<script>
// SWITCH FORMS
function showSignup() {
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("signupForm").classList.remove("hidden");
}

function showLogin() {
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("loginForm").classList.remove("hidden");
}

// SIGNUP
function signup() {
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  if (!email || !password) {
    alert("Fill all fields");
    return;
  }

  localStorage.setItem("user", JSON.stringify({ email, password }));

  alert("Signup successful!");
  showLogin();
}

// LOGIN
function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const user = JSON.parse(localStorage.getItem("user"));

  if (!user) {
    alert("No account found!");
    return;
  }

  if (email === user.email && password === user.password) {
    alert("Login successful!");
    localStorage.setItem("isLoggedIn", "true");

    // redirect page
    window.location.href = "home.html";
  } else {
    alert("Invalid credentials");
  }
}

// LOGOUT (use in other pages)
function logout() {
  localStorage.removeItem("isLoggedIn");
  window.location.href = "index.html";
}

function forgotPassword() {
  const email = prompt("Enter your registered email:");

  const user = JSON.parse(localStorage.getItem("user"));

  if (!user) {
    alert("No account found!");
    return;
  }

  if (email === user.email) {
    alert("Your password is: " + user.password);
  } else {
    alert("Email not found!");
  }
}

function socialLogin(platform) {
  if (platform === "google") {
    window.open("https://accounts.google.com", "_blank");
  } 
  else if (platform === "facebook") {
    window.open("https://facebook.com", "_blank");
  }
  else if (platform === "instagram") {
    window.open("https://instagram.com", "_blank");
  }
  else if (platform === "twitter") {
    window.open("https://twitter.com", "_blank");
  }
}
</script>

</body>
</html>
